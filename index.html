<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>OAK Specialty Coffee</title>
 
<style>
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
background:#111;
overflow:hidden;
font-family:Arial,sans-serif;
}
 
.loader{
position:fixed;
inset:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:30px;
z-index:9999;
}
 
.slider{
display:flex;
height:100vh;
transition:transform .5s ease-in-out;
}
 
.slide{
min-width:100vw;
height:100vh;
position:relative;
}
 
.slide img{
width:100%;
height:100%;
object-fit:contain;
}
 
.btn{
position:fixed;
top:50%;
transform:translateY(-50%);
width:50px;
height:50px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.5);
color:white;
font-size:24px;
cursor:pointer;
z-index:100;
}
 
.prev{
left:15px;
}
 
.next{
right:15px;
}
 
.dots{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
z-index:100;
}
 
.dot{
height:10px;
width:10px;
margin:0 4px;
background:#888;
border-radius:50%;
display:inline-block;
transition:.3s;
}
 
.dot.active{
background:#fff;
transform:scale(1.5);
}
 
.section-title{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
color:white;
background:rgba(0,0,0,.5);
padding:10px 20px;
border-radius:25px;
z-index:100;
}
 
@media(max-width:768px){
 
.btn{
width:40px;
height:40px;
font-size:20px;
}
 
}
 
</style>
</head>
<body>
 
<div class="loader" id="loader">
OAK MENU
</div>
 
<div class="section-title" id="title">
Dark Coffee
</div>
 
<button class="btn prev">❮</button>
<button class="btn next">❯</button>
 
<div class="slider" id="slider">
 
<div class="slide"><img src="1.jpg.jfif"></div>
<div class="slide"><img src="2.jpg.jfif"></div>
<div class="slide"><img src="3.jpg.jfif"></div>
<div class="slide"><img src="4.jpg.jfif"></div>
<div class="slide"><img src="5.jpg.jfif"></div>
<div class="slide"><img src="6.jpg.jfif"></div>
<div class="slide"><img src="7.jpg.jfif"></div>
 
</div>
 
<div class="dots" id="dots"></div>
 
<script>
 
const slider = document.getElementById('slider');
 
const titles = [
'Dark Coffee',
'Milk Coffee',
'Matcha',
'Soft Drinks',
'Milkshakes',
'Desserts',
'Bakery'
];
 
let current = 0;
 
const dotsContainer = document.getElementById('dots');
 
for(let i=0;i<titles.length;i++){
 
const dot = document.createElement('span');
 
dot.classList.add('dot');
 
if(i===0){
dot.classList.add('active');
}
 
dot.addEventListener('click',()=>{
current=i;
updateSlider();
});
 
dotsContainer.appendChild(dot);
 
}
 
function updateSlider(){
 
slider.style.transform =
`translateX(-${current * 100}vw)`;
 
document.getElementById('title')
.innerText = titles[current];
 
document.querySelectorAll('.dot')
.forEach(dot=>dot.classList.remove('active'));
 
document.querySelectorAll('.dot')[current]
.classList.add('active');
 
}
 
document.querySelector('.next')
.addEventListener('click',()=>{
 
if(current<titles.length-1){
current++;
updateSlider();
}
 
});
 
document.querySelector('.prev')
.addEventListener('click',()=>{
 
if(current>0){
current--;
updateSlider();
}
 
});
 
let startX=0;
 
slider.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});
 
slider.addEventListener("touchend",e=>{
 
let endX=e.changedTouches[0].clientX;
 
if(startX-endX>50 && current<titles.length-1){
 
current++;
updateSlider();
 
}
 
if(endX-startX>50 && current>0){
 
current--;
updateSlider();
 
}
 
});
 
window.onload=()=>{
 
setTimeout(()=>{
document.getElementById('loader').style.display='none';
},1200);
 
}
 
</script>
 
</body>
</html>
